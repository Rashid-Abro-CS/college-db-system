<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Database System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-university me-2"></i>College DB System
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="navMenu">
                    <li class="nav-item"><a class="nav-link" href="#" onclick="showPage('dashboard')"><i class="fas fa-chart-line"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="showPage('students')"><i class="fas fa-users"></i> Students</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="showPage('courses')"><i class="fas fa-book"></i> Courses</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="showPage('attendance')"><i class="fas fa-calendar-check"></i> Attendance</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="showPage('results')"><i class="fas fa-chart-simple"></i> Results</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="showPage('search')"><i class="fas fa-search"></i> Search</a></li>
                    <li class="nav-item"><a class="nav-link text-danger" href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Login Form -->
        <div id="loginPage" class="row justify-content-center mt-5">
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h4><i class="fas fa-sign-in-alt"></i> Login</h4>
                    </div>
                    <div class="card-body">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label>Email</label>
                                <input type="email" id="loginEmail" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label>Password</label>
                                <input type="password" id="loginPassword" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div id="mainContent" style="display: none;">
            <div id="pageContent"></div>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal fade" id="studentModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Add/Edit Student</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="studentForm">
                        <input type="hidden" id="studentId">
                        <div class="mb-2"><input type="text" id="studentName" class="form-control" placeholder="Full Name" required></div>
                        <div class="mb-2"><input type="email" id="studentEmail" class="form-control" placeholder="Email" required></div>
                        <div class="mb-2"><input type="text" id="studentIdNumber" class="form-control" placeholder="Student ID" required></div>
                        <div class="mb-2"><input type="text" id="enrollmentNumber" class="form-control" placeholder="Enrollment Number" required></div>
                        <div class="mb-2">
                            <select id="department" class="form-control" required>
                                <option value="">Select Department</option>
                                <option value="CSE">CSE</option>
                                <option value="ECE">ECE</option>
                                <option value="ME">ME</option>
                                <option value="CE">CE</option>
                                <option value="EE">EE</option>
                            </select>
                        </div>
                        <div class="mb-2"><input type="number" id="semester" class="form-control" placeholder="Semester" min="1" max="8" required></div>
                        <div class="mb-2"><input type="text" id="batch" class="form-control" placeholder="Batch (e.g., 2024)" required></div>
                        <button type="submit" class="btn btn-primary w-100">Save Student</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
